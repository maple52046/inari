# nginx terminating TLS in front of Inari, which listens on loopback HTTP and
# is mounted under /dashboard.
#
# Inari never builds an absolute URL to itself and never reads X-Forwarded-*,
# so the scheme it is reached over does not have to be communicated to it. Two
# things do matter, and both are marked below: the Host header, and the read
# timeout.

server {
    listen 80;
    listen [::]:80;
    server_name inari.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inari.example.com;

    ssl_certificate     /etc/letsencrypt/live/inari.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inari.example.com/privkey.pem;

    # `/dashboard` without the trailing slash does not match the prefix block
    # below, so it is redirected rather than falling through to a 404.
    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        # No URI part after the port, so the original path reaches Inari
        # unchanged. Writing `http://127.0.0.1:3000/` instead would strip
        # `/dashboard` and every request would 404, because Inari is mounted
        # under that prefix and expects to see it.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        # Load-bearing. Mutating requests are rejected unless the browser's
        # Origin matches the Host, which is what blocks cross-site submission
        # of a session that carries S3 credentials. Forwarding nginx's own
        # upstream host instead would make every POST fail with 403
        # `cross_origin`.
        #
        # `$http_host` rather than `$host`: it keeps the port, so a site served
        # on a non-default port still matches its own Origin.
        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A usage or cleanup scan walks every object beneath its scope and can
        # run for minutes on a large bucket. nginx's 60s default would cut it
        # off as a 504 while the scan is still working.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Probes stay at the root, outside the prefix, so they are deliberately not
    # proxied here. Monitor the service directly on 127.0.0.1:3000/healthz.
}
