apiVersion: apps/v1
kind: Deployment
metadata:
  name: inari
  namespace: inari
  labels:
    app.kubernetes.io/name: inari
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inari
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inari
    spec:
      containers:
        - name: inari
          image: ghcr.io/maple52046/inari:20260630-205811
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # SESSION_SECRET, DEFAULT_S3_ENDPOINT and optionally BASE_PATH come
          # from the Secret.
          envFrom:
            - secretRef:
                name: inari-env
          env:
            # Trusted in addition to the image's CA bundle, not instead of it:
            # mounting over the bundle would leave the pod unable to reach any
            # public endpoint. Equivalent to the old NODE_EXTRA_CA_CERTS.
            - name: INARI_EXTRA_CA_CERTS
              value: /etc/inari-ca/ca.crt
          volumeMounts:
            - name: ca
              mountPath: /etc/inari-ca
              readOnly: true
          # Served at the root regardless of BASE_PATH, so a prefixed
          # deployment does not have to keep its probes in step with its mount
          # point. They also do no S3 work, so a storage outage cannot
          # restart-loop the pod.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 20
          # Sized from measurement: the process idles near 14 MiB and stays flat
          # through exhaustive bucket scans, because listings are paginated and
          # the cleanup scan keeps only the candidates it returns.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: ca
          configMap:
            name: inari-ca
